# Squash Message Clean — amends bloated squash-merge commit bodies to 1 line.
# Installed by: noa hook install-action

name: Squash Message Clean

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  clean:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Amend squash message
        run: |
          set -euo pipefail
          BODY_LINES=$(git log -1 --format='%B' | wc -l)
          if [ "$BODY_LINES" -le 1 ]; then
            echo "Commit body is already clean (${BODY_LINES} lines), skipping."
            exit 0
          fi
          SUBJECT=$(git log -1 --format='%s')
          git commit --amend -m "$SUBJECT"
          git push --force-with-lease
